<div class="page-container">
    <header class="page-header">
        <h1>Mi Perfil</h1>
        <p>Gestiona tu información personal y preferencias</p>
    </header>

    <div class="profile-content">
        <div class="profile-card glass-panel">
            <div class="avatar-section">
                <div class="avatar-wrapper">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" alt="Avatar">
                    <button class="edit-avatar-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 20h9"></path>
                            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                        </svg>
                    </button>
                </div>
                <h2>{{user?.firstName }} {{user?.lastName}}</h2>
                <span class="badge premium">Premium</span>
            </div>

            <form class="profile-form">
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" value="{{user?.firstName }}" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Apellido:</label>
                    <input type="text" value="{{user?.lastName }}" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" value="{{user?.email }}" class="glass-input">
                </div>
                <button class="save-btn">Guardar Cambios</button>
            </form>
        </div>
    </div>
</div>
