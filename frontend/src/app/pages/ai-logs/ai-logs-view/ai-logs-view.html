<div class="logs-container">
    <div class="header">
        <h1>Registros de IA</h1>
        <p class="subtitle">Historial de interacciones con el modelo de lenguaje natural</p>
    </div>

    <div class="table-wrapper">
        <table class="logs-table">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Modelo</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let log of logs">
                    <td>
                        <span class="date">{{ formatDate(log.created_at) }}</span>
                    </td>
                    <td>
                        <span class="type-badge">{{ log.type }}</span>
                    </td>
                    <td>
                        <span class="model">{{ log.model }}</span>
                    </td>
                    <td>
                        <button class="view-btn" (click)="onView(log)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor"
                                    stroke-width="2" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" />
                            </svg>
                            Ver Detalles
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="empty-state" *ngIf="logs.length === 0">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
                <path
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <h3>No hay registros</h3>
            <p>Aún no se han registrado interacciones con la IA.</p>
        </div>
    </div>
</div>

<app-ai-log-detail *ngIf="selectedLog" [log]="selectedLog" (close)="closeDetailModal()">
</app-ai-log-detail>
