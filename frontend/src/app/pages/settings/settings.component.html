<div class="page-container">
    <header class="page-header">
        <h1>Configuración</h1>
        <p>Personaliza tu experiencia en GroFund</p>
    </header>

    <div class="settings-grid">
        <!-- General Settings -->
        <section class="settings-card glass-panel">
            <h3>General</h3>

            <div class="setting-item">
                <div class="setting-info">
                    <span class="label">Tema Oscuro</span>
                    <span class="description">Activar interfaz oscura</span>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </section>

        <!-- Notifications -->
        <section class="settings-card glass-panel">
            <h3>Notificaciones</h3>

            <div class="setting-item">
                <div class="setting-info">
                    <span class="label">Alertas de Presupuesto</span>
                    <span class="description">Recibir alertas cuando excedas el límite</span>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="setting-item">
                <div class="setting-info">
                    <span class="label">Resumen Semanal</span>
                    <span class="description">Recibir reporte semanal por correo</span>
                </div>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider round"></span>
                </label>
            </div>
        </section>

        <!-- Security -->
        <section class="settings-card glass-panel">
            <h3>Seguridad</h3>

            <button class="action-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Cambiar Contraseña
            </button>

            <button class="action-btn danger">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18"></path>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Eliminar Cuenta
            </button>
        </section>
    </div>
</div>
