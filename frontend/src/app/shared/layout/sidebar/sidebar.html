<aside class="sidebar" [class.collapsed]="!isOpen">
  <div class="sidebar-header">
    <div class="logo-area">
      <span class="logo-text">GroFund</span>
    </div>
    <button class="toggle-btn" (click)="toggle.emit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
  </div>

  <div class="sidebar-content">
    <nav class="nav-section">
      <div class="section-label">Menu Principal</div>

      <a *ngFor="let item of menuItems" [routerLink]="item.route" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact || false }" class="nav-item" [title]="!isOpen ? item.label : ''">
        <div class="active-indicator"></div>
        <span class="icon" [innerHTML]="item.safeIcon"></span>
        <span class="label">{{ item.label }}</span>
        <div class="glow-effect"></div>
      </a>
    </nav>
  </div>
</aside>
