<form (ngSubmit)="onSubmit()">
  <label>Nombre de la categoría</label>
  <input
    [(ngModel)]="data.name"
    name="name"
    required
    [disabled]="loading"
    placeholder="Ej: Comida"
  />
  <button type="submit" [disabled]="loading || !data.name?.trim()">
    <span *ngIf="!loading">Guardar</span>
    <span *ngIf="loading">Guardando...</span>
  </button>
</form>
